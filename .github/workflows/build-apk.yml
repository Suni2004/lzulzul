# Megépíti a telepíthető Android APK-t, és közzéteszi az `apk` nevű
# release-ben, ahonnan a telefonról egy koppintással letölthető.
#
# Indul: minden pusholásnál erre az ágra, illetve kézzel az Actions fülön.

name: APK építése

on:
  workflow_dispatch:
  push:
    branches:
      - claude/mobile-app-ddxynw
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

# A release közzétételéhez írási jog kell a repóhoz.
permissions:
  contents: write

# A futás sorszáma egyben a versionCode és az a szám, amivel a telepített app
# összeveti magát a közzétett verzióval. Az EXPO_PUBLIC_ előtag miatt az Expo
# beépíti a JS bundle-be.
env:
  EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}

# Egyszerre csak egy build fusson; az újabb push megszakítja a régit.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Node beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK beállítása
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # A setup-java beépített gradle-cache-e itt nem használható: a checkout
      # után még nincs egyetlen gradle fájl sem, azokat a prebuild generálja.
      # Ezért saját cache, fix kulccsal.
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', '.github/workflows/build-apk.yml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Függőségek telepítése
        run: npm ci

      # Minőségi kapu: hibás kódból ne szülessen APK.
      - name: TypeScript ellenőrzés
        run: npx tsc --noEmit

      - name: Tesztek
        run: npm test

      - name: Natív Android projekt generálása
        run: npx expo prebuild --platform android --no-install

      # Csak arm64-v8a: minden 2015 utáni Android telefon ilyen. A 32 bites
      # armeabi-v7a és az emulátoros x86 változatok elhagyása ~14 MB-tal
      # kisebb APK-t és rövidebb build időt jelent.
      - name: APK fordítása
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: APK elnevezése
        run: cp android/app/build/outputs/apk/release/app-release.apk napirend.apk

      # Ezt tölti le a telepített app, hogy eldöntse, kell-e frissítenie.
      - name: Verzióleíró készítése
        run: |
          cat > version.json <<JSON
          {
            "build": ${{ github.run_number }},
            "version": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/apk/napirend.apk",
            "notes": "$(git log -1 --pretty=%s | sed 's/"/\\"/g')"
          }
          JSON
          cat version.json

      - name: Feltöltés build-melléklerként
        uses: actions/upload-artifact@v4
        with:
          name: napirend-apk
          path: |
            napirend.apk
            version.json
          retention-days: 30

      # Fix `apk` tag, hogy a letöltési link mindig ugyanaz maradjon.
      - name: Közzététel release-ként
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk napirend.apk version.json \
            --title "Napirend – legfrissebb APK" \
            --notes "Telepíthető Android alkalmazás.

          **Telepítés:** töltsd le a lenti \`napirend.apk\` fájlt a telefonodra, és nyisd meg. Az Android rá fog kérdezni, hogy engedélyezed-e az ismeretlen forrásból való telepítést — ez normális sideloadingnál.

          Az app első indításkor naptár- és értesítési engedélyt kér; mindkettő kell a működéséhez.

          Készült a \`${GITHUB_SHA:0:7}\` commitból."
