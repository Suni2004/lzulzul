<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Szív</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap">
<style>
  /* Egyképernyős, szándékosan sötét világ: ASCII-eső, középen a gomb, utána a forgó ASCII szív. */
  :root {
    --bg: #07020a;
    --bg-glow: #2b0716;
    --violet: #1a0624;
    --ink: #ffe3ec;
    --rose: #ff2d6f;
    --rose-soft: #ff8fb4;
    --cyan: #66f2ff;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse at 50% 52%, var(--bg-glow) 0%, transparent 58%),
      radial-gradient(ellipse at 85% 10%, var(--violet) 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: pointer;
    touch-action: manipulation;
  }
  /* CRT hangulat: vignetta + finom pásztázó sorok */
  .fx {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.65) 100%),
      repeating-linear-gradient(180deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
    mix-blend-mode: normal;
  }
  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    z-index: 2;
    transition: opacity .55s ease, transform .55s cubic-bezier(.6,-0.5,.7,1), filter .55s ease;
  }
  .stage.gone { opacity: 0; transform: scale(1.8); filter: blur(8px); pointer-events: none; }
  .wrap {
    display: grid; justify-items: center; gap: 22px; text-align: center;
    padding: 48px 40px;
    background: radial-gradient(ellipse at center, rgba(7,2,10,.92) 0%, rgba(7,2,10,.7) 45%, transparent 72%);
  }
  .deco {
    font-size: 13px; line-height: 1.05; color: var(--rose-soft);
    white-space: pre; margin: 0; letter-spacing: .06em;
    text-shadow: 0 0 10px var(--rose);
    animation: beat 1.1s infinite;
  }
  button#go {
    position: relative;
    font-family: var(--mono);
    font-weight: 800;
    font-size: clamp(26px, 7vw, 56px);
    letter-spacing: .14em;
    color: var(--ink);
    background: linear-gradient(180deg, rgba(255,45,111,.22), rgba(90,6,40,.45));
    border: 2px solid var(--rose);
    border-radius: 3px;
    padding: .55em 1.1em .55em 1.24em;
    cursor: pointer;
    text-shadow: 0 0 14px var(--rose);
    box-shadow:
      0 0 0 1px rgba(255,143,180,.3) inset,
      0 0 30px rgba(255,45,111,.6),
      0 0 110px rgba(255,45,111,.3);
    animation: beat 1.1s infinite;
    transition: background .2s, color .2s;
  }
  button#go::before, button#go::after {
    content: "NYOMD MEG!";
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding-left: .14em;
    pointer-events: none; opacity: 0;
  }
  button#go::before { color: var(--cyan); }
  button#go::after  { color: var(--rose); }
  button#go:hover { background: var(--rose); color: var(--bg); text-shadow: none; }
  button#go:hover::before { opacity: .7; animation: glitchA .35s steps(2) infinite; }
  button#go:hover::after  { opacity: .7; animation: glitchB .35s steps(2) infinite; }
  button#go:focus-visible { outline: 2px dashed var(--rose-soft); outline-offset: 8px; }
  @keyframes glitchA {
    0% { transform: translate(-3px, 1px); clip-path: inset(0 0 55% 0); }
    100% { transform: translate(3px, -1px); clip-path: inset(40% 0 0 0); }
  }
  @keyframes glitchB {
    0% { transform: translate(3px, -1px); clip-path: inset(60% 0 0 0); }
    100% { transform: translate(-3px, 1px); clip-path: inset(0 0 30% 0); }
  }
  @keyframes beat {
    0%, 40%, 100% { transform: scale(1); }
    8%  { transform: scale(1.07); }
    18% { transform: scale(1.01); }
    26% { transform: scale(1.05); }
  }
  .tag {
    font-size: 12px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--rose-soft); opacity: .7; margin: 0;
  }
  .hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-size: 12px; letter-spacing: .2em;
    color: var(--rose-soft); opacity: 0; transition: opacity 1.2s ease 2.4s;
    z-index: 3; pointer-events: none;
  }
  .hint.on { opacity: .6; }
  @media (prefers-reduced-motion: reduce) {
    button#go, .deco { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Forgó, dobogó ASCII szív hulló szívecske-esőben"></canvas>
<div class="fx" aria-hidden="true"></div>

<div class="stage" id="stage">
  <div class="wrap">
    <pre class="deco" aria-hidden="true">  .:::.   .:::.
 :::::::.:::::::
 :::::::::::::::
 ':::::::::::::'
   ':::::::::'
     ':::::'
       ':'</pre>
    <button id="go" type="button">NYOMD MEG!</button>
    <p class="tag">♥ egy meglepetés vár ♥</p>
  </div>
</div>
<div class="hint" id="hint">kattints a szívre ♥</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const norm = v => { const n = Math.hypot(...v); return v.map(c => c / n); };

  // Bloom (ragyogás) segédvásznak: lekicsinyítve, majd visszanagyítva hozzáadjuk
  const b1 = document.createElement('canvas'), b1x = b1.getContext('2d');
  const b2 = document.createElement('canvas'), b2x = b2.getContext('2d');
  b1x.imageSmoothingQuality = 'high'; b2x.imageSmoothingQuality = 'high';

  // ───────── Szív anyag: karakter rámpa + két színtónus (rózsa és lila) ─────────
  const RAMP = " .,:;-~=+*ox#%&@$";
  const LEVELS = 24, TINTS = 4;
  const SCRAMBLE = "<3♥*#@%&$!?/\\|01SZERETLEK";
  const ROSE = [[0, [60, 0, 18]], [.3, [150, 6, 46]], [.55, [255, 38, 98]], [.82, [255, 128, 176]], [1, [255, 226, 238]]];
  const VIOL = [[0, [28, 0, 44]], [.3, [92, 12, 140]], [.55, [176, 64, 236]], [.8, [228, 168, 255]], [1, [250, 242, 255]]];
  const ramp = (st, t) => {
    for (let i = 1; i < st.length; i++) if (t <= st[i][0]) {
      const [t0, c0] = st[i - 1], [t1, c1] = st[i], k = (t - t0) / (t1 - t0);
      return c0.map((c, j) => c + (c1[j] - c) * k);
    }
    return st[st.length - 1][1];
  };
  const COLORS = [];
  for (let l = 0; l < LEVELS; l++) for (let tn = 0; tn < TINTS; tn++) {
    const t = l / (LEVELS - 1), m = (tn / (TINTS - 1)) * 0.7;
    const a = ramp(ROSE, t), b = ramp(VIOL, t);
    COLORS.push(`rgb(${a.map((c, j) => Math.round(c + (b[j] - c) * m)).join(',')})`);
  }
  const CHARS = Array.from({ length: LEVELS }, (_, i) => i === LEVELS - 1 ? '♥'
    : RAMP[Math.min(RAMP.length - 1, 1 + Math.floor(i / (LEVELS - 1) * (RAMP.length - 1)))]);

  // A klasszikus 3D szív implicit felülete: f < 0 belül
  function heart(x, y, z) {
    const a = x * x + 2.25 * y * y + z * z - 1;
    const z3 = z * z * z;
    return a * a * a - x * x * z3 - 0.1125 * y * y * z3;
  }

  // ───────── Méretezés ─────────
  let W, H, dpr, fs, cw, ch, S, cols, rows;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    b1.width = Math.max(1, Math.round(W / 4)); b1.height = Math.max(1, Math.round(H / 4));
    b2.width = Math.max(1, Math.round(W / 14)); b2.height = Math.max(1, Math.round(H / 14));
    S = Math.min(W * 0.34, H * 0.32);
    fs = Math.max(7, Math.min(15, (2.4 * S / 80) / 0.6));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `800 ${fs}px ${FONT}`;
    cw = ctx.measureText('M').width;
    ch = fs * 1.12;
    cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
    initRain();
  }

  // ───────── ASCII-eső: hulló ♥, <3 és SZERETLEK jelek két mélységi rétegben ─────────
  const RAIN_GLYPHS = '♥♥♥<3<3♡*+·:SZERETLEK'.split('');
  const SPELLS = ['SZERETLEK', '<3', '♥', 'SZERETLEK ♥ '];
  let drops = [];
  function makeDrop(near, x, initial) {
    const size = near ? rand(15, 21) : rand(9, 12.5);
    const len = near ? randi(7, 16) : randi(10, 26);
    const spell = Math.random() < 0.4 ? SPELLS[randi(0, SPELLS.length - 1)] : null;
    const lh = size * 1.12;
    return {
      near, x, size, len, lh, spell,
      y: initial ? rand(-H * 0.3, H * 1.1) : rand(-len * lh, -lh),
      v: (near ? rand(110, 210) : rand(35, 100)) * (reduce ? 0.35 : 1),
      alpha: near ? rand(0.45, 0.85) : rand(0.18, 0.42),
      glyphs: Array.from({ length: len }, (_, k) =>
        spell ? spell[(len - 1 - k) % spell.length] : RAIN_GLYPHS[randi(0, RAIN_GLYPHS.length - 1)]),
    };
  }
  function initRain() {
    drops = [];
    const colW = 13;
    for (let x = colW / 2; x < W; x += colW) if (Math.random() < 0.55) drops.push(makeDrop(false, x, true));
    const nNear = Math.max(4, Math.round(W / 70));
    for (let i = 0; i < nNear; i++) drops.push(makeDrop(true, rand(0, W), true));
    drops.sort((a, b) => a.near - b.near);
  }
  function drawRain(dt, glow) {
    ctx.textAlign = 'center';
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      d.y += d.v * dt;
      if (d.y - d.len * d.lh > H) { drops[i] = makeDrop(d.near, d.near ? rand(0, W) : d.x, false); continue; }
      if (!d.spell && Math.random() < dt * 3) d.glyphs[randi(0, d.len - 1)] = RAIN_GLYPHS[randi(0, RAIN_GLYPHS.length - 1)];
      ctx.font = `${d.near ? 800 : 400} ${d.size.toFixed(1)}px ${FONT}`;
      const boost = 1 + glow * (d.near ? 0.5 : 0.9);
      ctx.fillStyle = d.near ? '#ff3d7f' : '#b3245c';
      for (let k = d.len - 1; k >= 1; k--) {
        const y = d.y - k * d.lh;
        if (y < -d.lh || y > H + d.lh) continue;
        ctx.globalAlpha = Math.min(1, d.alpha * Math.pow(1 - k / d.len, 1.6) * boost);
        ctx.fillText(d.glyphs[k], d.x, y);
      }
      if (d.y > -d.lh && d.y < H + d.lh) {
        ctx.fillStyle = '#fff2f7';
        ctx.globalAlpha = Math.min(1, (d.alpha + 0.25) * boost);
        ctx.fillText(d.glyphs[0], d.x, d.y);
      }
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // ───────── Keringő "szeretlek" szavak: mindegyik saját, véletlen dőlésű pályán ─────────
  const WORDS = ['SZERETLEK', 'szeretlek', '<3 SZERETLEK <3', '♥ szeretlek ♥', 'SZERETLEK!', '* szeretlek *', 'SZERETLEK ♥', '~ szeretlek ~'];
  const ORBITS = Array.from({ length: 18 }, (_, i) => {
    const u = Math.random() * 2 - 1, ph = Math.random() * Math.PI * 2;
    const n = [Math.sqrt(1 - u * u) * Math.cos(ph), u, Math.sqrt(1 - u * u) * Math.sin(ph)];
    const ref = Math.abs(n[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    const a = norm([n[1] * ref[2] - n[2] * ref[1], n[2] * ref[0] - n[0] * ref[2], n[0] * ref[1] - n[1] * ref[0]]);
    const b = [n[1] * a[2] - n[2] * a[1], n[2] * a[0] - n[0] * a[2], n[0] * a[1] - n[1] * a[0]];
    return {
      text: WORDS[i % WORDS.length], a, b,
      r: 1.45 + Math.random() * 0.7,
      wob: 0.08 + Math.random() * 0.18, wobS: 0.5 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
      speed: (0.35 + Math.random() * 0.9) * (Math.random() < 0.5 ? -1 : 1) * (reduce ? 0.4 : 1),
      prec: (Math.random() - 0.5) * 0.6,
      size: 1.1 + Math.random() * 1.1,
      bold: Math.random() < 0.55 ? 800 : 400,
    };
  });
  let wordPts = [];
  function placeWords(t) {
    const fit = Math.min(1, (W * 0.46) / (2.3 * 1.2 * S));
    const fitY = Math.min(1, (H * 0.44) / (2.3 * 1.2 * S));
    wordPts = ORBITS.map(o => {
      const th = o.phase + o.speed * t;
      const rr = o.r + o.wob * Math.sin(t * o.wobS + o.phase);
      let x = Math.cos(th) * o.a[0] + Math.sin(th) * o.b[0];
      const y = Math.cos(th) * o.a[1] + Math.sin(th) * o.b[1];
      let z = Math.cos(th) * o.a[2] + Math.sin(th) * o.b[2];
      const pc = Math.cos(t * o.prec), ps = Math.sin(t * o.prec);
      [x, z] = [x * pc + z * ps, -x * ps + z * pc];
      return { o, x: x * rr * fit, y: y * rr * fitY, z };
    }).sort((p, q) => p.z - q.z);
  }
  function drawWords(cx, cy, fade, front) {
    if (fade <= 0) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const p of wordPts) {
      if ((p.z >= 0) !== front) continue;
      const depth = (p.z + 1) / 2;
      const persp = 0.8 + 0.4 * depth;
      const size = Math.max(6, Math.round(fs * p.o.size * (0.55 + 0.75 * depth)));
      ctx.font = `${p.o.bold} ${size}px ${FONT}`;
      ctx.globalAlpha = fade * (0.15 + 0.85 * depth * depth);
      ctx.fillStyle = depth > 0.78 ? '#fff0f5' : depth > 0.5 ? '#ff8fb4' : '#a3205a';
      ctx.fillText(p.o.text, cx + p.x * S * persp, cy - p.y * S * persp);
    }
    ctx.restore();
  }

  // ───────── Részecskék és lökéshullámok ─────────
  let parts = [], rings = [];
  let kick = 0;
  function burst(x, y, n = 80) {
    kick = 1;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 380;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 1, c: '♥<3*+.SZERETLEK'[randi(0, 14)] });
    }
  }
  function drawRings(t, cx, cy) {
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 ${Math.round(fs * 1.1)}px ${FONT}`;
    ctx.fillStyle = '#ff6a9d';
    rings = rings.filter(r => t - r.t0 < r.dur);
    for (const r of rings) {
      const age = (t - r.t0) / r.dur;
      const rad = S * (r.r0 + age * r.grow);
      const n = Math.min(160, Math.floor((2 * Math.PI * rad) / (fs * 1.5)));
      ctx.globalAlpha = Math.pow(1 - age, 2) * r.a;
      for (let i = 0; i < n; i++) {
        const th = (i / n) * Math.PI * 2 + r.t0;
        ctx.fillText(r.g[i % r.g.length], (r.x ?? cx) + Math.cos(th) * rad, (r.y ?? cy) + Math.sin(th) * rad * 0.82);
      }
    }
    ctx.restore();
  }

  // Dupla szívdobbanás görbe
  function beat(t) {
    const b = t % 1.1;
    const g = (m, w) => Math.exp(-(((b - m) / w) ** 2));
    return g(0.08, 0.055) + 0.6 * g(0.3, 0.06);
  }

  // fények: meleg fő fény balról-fentről, lila derítő jobbról, csúcsfény
  const Lk = norm([-0.5, 0.65, 0.6]);
  const Lf = norm([0.9, -0.15, 0.35]);
  const Hk = norm([Lk[0], Lk[1], Lk[2] + 1]);

  // cellánként állandó pszeudo-véletlen (a beúszó intróhoz)
  const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };

  let started = false, tStart = 0, last = 0, lastBeat = -1;
  let mx = 0, my = 0, pmx = 0, pmy = 0;
  let glitch = { until: 0, r0: 0, r1: 0, dx: 0 };
  const buckets = Array.from({ length: LEVELS * TINTS }, () => []);

  function frame(now) {
    const T = now / 1000;
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    pmx += (mx - pmx) * Math.min(1, dt * 2.5);
    pmy += (my - pmy) * Math.min(1, dt * 2.5);

    ctx.clearRect(0, 0, W, H);
    const t = started ? T - tStart : 0;
    const pulse = beat(started ? t : T);
    drawRain(dt, pulse);

    if (started) drawHeart(t, dt, pulse);

    // villanás az indításkor
    if (started && t < 0.7) {
      ctx.fillStyle = `rgba(255, 190, 215, ${0.75 * Math.pow(1 - t / 0.7, 2)})`;
      ctx.fillRect(0, 0, W, H);
    }

    // bloom
    b1x.clearRect(0, 0, b1.width, b1.height);
    b1x.drawImage(cv, 0, 0, b1.width, b1.height);
    b2x.clearRect(0, 0, b2.width, b2.height);
    b2x.drawImage(b1, 0, 0, b2.width, b2.height);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const bk = Math.max(0.3, Math.min(1, (fs - 5) / 9)); // kis betűméretnél sűrűbb a kép, kevesebb ragyogás kell
    ctx.globalAlpha = 0.22 * bk; ctx.drawImage(b1, 0, 0, W, H);
    ctx.globalAlpha = (0.5 + 0.3 * pulse) * bk; ctx.drawImage(b2, 0, 0, W, H);
    ctx.restore();

    requestAnimationFrame(frame);
  }

  function drawHeart(t, dt, pulse) {
    const intro = Math.min(1, t / 1.8);
    const grow = intro >= 1 ? 1 : 1 - Math.pow(2, -8 * intro) * Math.cos(intro * 9);
    const conv = Math.pow(1 - clamp01(t / 1.6), 3);   // szétszórt karakterek összeállása
    kick = Math.max(0, kick - dt * 2.5);
    const sc = Math.max(0.05, grow * (1 + 0.075 * pulse + 0.18 * kick * kick));

    const spin = (reduce ? t * 0.35 : t * 1.1) + pmx * 0.9;
    const tilt = 0.26 * Math.sin(t * 0.7) + pmy * 0.6;
    const cA = Math.cos(spin), sA = Math.sin(spin), cB = Math.cos(tilt), sB = Math.sin(tilt);
    const cx = W / 2, cy = H / 2 + S * 0.02;

    // dobbanáskor lökéshullám
    const bi = Math.floor((t - 0.08) / 1.1);
    if (bi !== lastBeat && t > 1.2) {
      lastBeat = bi;
      rings.push({ t0: t, dur: 1.5, r0: 1.0, grow: 2.6, a: 0.5, g: ['·', '·', '*', '·', '♥', '·'] });
    }

    // sötét udvar a szív mögött, hogy kiváljon az esőből + izzás
    const hr = S * 1.75 * Math.max(0.4, sc);
    let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, hr);
    g.addColorStop(0, 'rgba(7,2,10,0.94)'); g.addColorStop(0.6, 'rgba(7,2,10,0.7)'); g.addColorStop(1, 'rgba(7,2,10,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - hr, cy - hr, hr * 2, hr * 2);
    g = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 1.4);
    g.addColorStop(0, `rgba(255,40,100,${0.12 + 0.14 * pulse})`); g.addColorStop(1, 'rgba(255,40,100,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - S * 1.4, cy - S * 1.4, S * 2.8, S * 2.8);

    drawRings(t, cx, cy);

    // nézet-térbeli pont -> szív koordináta
    const f = (u, v, w) => {
      const v2 = v * cB - w * sB, w2 = v * sB + w * cB;
      const x = (u * cA + w2 * sA) / sc;
      const y = (-u * sA + w2 * cA) / sc;
      const z = (v2 + 0.08) / sc;
      return heart(x, y, z);
    };

    for (const b of buckets) b.length = 0;
    const R = 1.45 * sc;
    const c0 = Math.max(0, Math.floor((cx - R * S) / cw)), c1 = Math.min(cols, Math.ceil((cx + R * S) / cw));
    const r0 = Math.max(0, Math.floor((cy - R * S) / ch)), r1 = Math.min(rows, Math.ceil((cy + R * S) / ch));
    const step = 0.07 * Math.max(0.5, sc);
    const eps = 0.003;
    let lowest = -Infinity;

    for (let r = r0; r < r1; r++) {
      const v = -((r + 0.5) * ch - cy) / S;
      for (let c = c0; c < c1; c++) {
        const u = ((c + 0.5) * cw - cx) / S;
        if (u * u + v * v > R * R) continue;
        const wmax = Math.sqrt(R * R - u * u - v * v);
        let wPrev = wmax, hit = null;
        for (let w = wmax - step; w >= -wmax; w -= step) {
          if (f(u, v, w) < 0) {
            let a = w, bw = wPrev;
            for (let k = 0; k < 9; k++) {
              const m = (a + bw) / 2;
              if (f(u, v, m) < 0) a = m; else bw = m;
            }
            hit = (a + bw) / 2;
            break;
          }
          wPrev = w;
        }
        if (hit === null) continue;

        let nx = f(u + eps, v, hit) - f(u - eps, v, hit);
        let ny = f(u, v + eps, hit) - f(u, v - eps, hit);
        let nz = f(u, v, hit + eps) - f(u, v, hit - eps);
        const nl = Math.hypot(nx, ny, nz) || 1;
        nx /= nl; ny /= nl; nz /= nl;
        if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }

        const diff = Math.max(0, nx * Lk[0] + ny * Lk[1] + nz * Lk[2]);
        const fill = 0.55 * Math.max(0, nx * Lf[0] + ny * Lf[1] + nz * Lf[2]);
        const spec = Math.pow(Math.max(0, nx * Hk[0] + ny * Hk[1] + nz * Hk[2]), 44);
        const rim = Math.pow(1 - nz, 3);
        const lum = clamp01(0.03 + 0.52 * diff + 0.35 * fill + 0.55 * spec + 0.34 * rim + 0.08 * pulse);
        const tint = Math.round(clamp01((fill + rim * 0.5) / (diff + fill + rim * 0.5 + 0.05)) * (TINTS - 1));
        buckets[Math.round(lum * (LEVELS - 1)) * TINTS + tint].push(c, r);
        if (r > lowest) lowest = r;
      }
    }

    // halvány tükröződés a szív alatt
    const mirror = lowest + 1.5;
    if (conv < 0.05) {
      ctx.globalAlpha = 0.1;
      for (let i0 = 0; i0 < buckets.length; i0++) {
        const b = buckets[i0]; if (!b.length) continue;
        ctx.fillStyle = COLORS[i0]; const chr = CHARS[(i0 / TINTS) | 0];
        for (let i = 0; i < b.length; i += 2) {
          const rr = 2 * mirror - b[i + 1];
          if (rr - mirror > 14 || rr >= rows) continue;
          ctx.fillText(chr, b[i] * cw, rr * ch + ch * 0.8);
        }
      }
      ctx.globalAlpha = 1;
    }

    // hátsó szavak
    const wordFade = clamp01((t - 1.0) / 1.2);
    placeWords(t);
    drawWords(cx, cy, wordFade, false);

    // glitch: néha egy sáv oldalra csúszik, ciánkék szellemképpel
    if (!reduce && t > 2.5 && performance.now() > glitch.until && Math.random() < dt * 0.35) {
      const a = randi(r0, r1);
      glitch = { until: performance.now() + rand(70, 160), r0: a, r1: a + randi(1, 4), dx: randi(-4, 4) || 2 };
    }
    const gl = performance.now() < glitch.until;

    // maga a szív
    const scramble = intro < 1 ? Math.pow(1 - intro, 1.4) : 0;
    for (let i0 = 0; i0 < buckets.length; i0++) {
      const b = buckets[i0]; if (!b.length) continue;
      const col = COLORS[i0]; const chr = CHARS[(i0 / TINTS) | 0];
      ctx.fillStyle = col;
      for (let i = 0; i < b.length; i += 2) {
        const c = b[i], r = b[i + 1];
        let x = c * cw, y = r * ch + ch * 0.8;
        if (conv > 0.001) {
          const hx = hash(c, r) * 2 - 1, hy = hash(r + 7.3, c - 3.1) * 2 - 1;
          x += hx * conv * W * 0.7; y += hy * conv * H * 0.7;
        }
        const glyph = scramble && Math.random() < scramble ? SCRAMBLE[(Math.random() * SCRAMBLE.length) | 0] : chr;
        if (gl && r >= glitch.r0 && r <= glitch.r1) {
          ctx.fillStyle = '#66f2ff'; ctx.globalAlpha = 0.6;
          ctx.fillText(glyph, x - glitch.dx * cw * 0.6, y);
          ctx.fillStyle = col; ctx.globalAlpha = 1;
          x += glitch.dx * cw;
        }
        ctx.fillText(glyph, x, y);
      }
    }

    // elülső szavak
    drawWords(cx, cy, wordFade, true);

    // részecskék
    for (const p of parts) {
      p.life -= dt * 0.75; p.vy += 260 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.life > 0.6 ? '#fff0f5' : '#ff2d6f';
      ctx.fillText(p.c, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    parts = parts.filter(p => p.life > 0);
  }

  document.getElementById('go').addEventListener('click', () => {
    stage.classList.add('gone');
    hint.classList.add('on');
    started = true;
    tStart = performance.now() / 1000;
    lastBeat = -1;
    rings.push({ t0: 0, dur: 1.2, r0: 0.2, grow: 4.5, a: 0.9, g: ['♥', '·', '<3', '·'] });
    burst(W / 2, H / 2, 120);
  });
  cv.addEventListener('pointerdown', e => {
    if (!started) return;
    const t = performance.now() / 1000 - tStart;
    burst(e.clientX, e.clientY);
    rings.push({ t0: t, dur: 1.0, r0: 0.05, grow: 1.4, a: 0.8, x: e.clientX, y: e.clientY, g: ['·', '♥', '·', '*'] });
  });
  addEventListener('pointermove', e => { mx = e.clientX / W - 0.5; my = e.clientY / H - 0.5; });

  addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
