<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Szív</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap">
<style>
  /* Egyképernyős, szándékosan sötét világ: középen a gomb, utána a forgó ASCII szív. */
  :root {
    --bg: #0b0407;
    --bg-glow: #2a0712;
    --ink: #ffd6e3;
    --rose: #ff2d6f;
    --rose-soft: #ff8fb4;
    --ember: #7a0a2a;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 55%, var(--bg-glow) 0%, var(--bg) 62%) fixed, var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    filter: drop-shadow(0 0 6px rgba(255, 45, 111, .55)) drop-shadow(0 0 22px rgba(255, 45, 111, .25));
    cursor: pointer;
  }
  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    z-index: 2;
    transition: opacity .6s ease, transform .6s cubic-bezier(.6,-0.4,.7,1);
  }
  .stage.gone { opacity: 0; transform: scale(1.6); pointer-events: none; }
  .wrap { display: grid; justify-items: center; gap: 18px; text-align: center; }
  .deco {
    font-size: 13px; line-height: 1.05; color: var(--rose-soft); opacity: .8;
    white-space: pre; margin: 0; letter-spacing: .06em;
  }
  button#go {
    font-family: var(--mono);
    font-weight: 800;
    font-size: clamp(26px, 7vw, 54px);
    letter-spacing: .12em;
    color: var(--ink);
    background: linear-gradient(180deg, rgba(255,45,111,.18), rgba(122,10,42,.35));
    border: 2px solid var(--rose);
    border-radius: 4px;
    padding: .55em 1.1em .55em 1.22em;
    cursor: pointer;
    text-shadow: 0 0 12px var(--rose);
    box-shadow: 0 0 0 1px rgba(255,143,180,.25) inset, 0 0 24px rgba(255,45,111,.55), 0 0 80px rgba(255,45,111,.25);
    animation: beat 1.1s infinite;
    transition: background .2s, color .2s;
  }
  button#go:hover { background: var(--rose); color: var(--bg); text-shadow: none; }
  button#go:focus-visible { outline: 2px dashed var(--rose-soft); outline-offset: 8px; }
  @keyframes beat {
    0%, 40%, 100% { transform: scale(1); }
    8%  { transform: scale(1.07); }
    18% { transform: scale(1.01); }
    26% { transform: scale(1.05); }
  }
  .hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-size: 12px; letter-spacing: .14em;
    color: var(--rose-soft); opacity: 0; transition: opacity 1.2s ease 1.6s;
    z-index: 3; pointer-events: none;
  }
  .hint.on { opacity: .55; }
  @media (prefers-reduced-motion: reduce) {
    button#go { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Forgó, dobogó ASCII szív"></canvas>

<div class="stage" id="stage">
  <div class="wrap">
    <pre class="deco" aria-hidden="true">  .:::.   .:::.
 :::::::.:::::::
 :::::::::::::::
 ':::::::::::::'
   ':::::::::'
     ':::::'
       ':'</pre>
    <button id="go" type="button">NYOMD MEG!</button>
  </div>
</div>
<div class="hint" id="hint">kattints a szívre ♥</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Fényerő -> karakter rámpa (sötéttől a világosig)
  const RAMP = " .,:-~=+*o#%&@$";
  const LEVELS = 24;
  const SCRAMBLE = "<3♥*#@%&$!?/\\|01";

  // Szín paletta fényerő szerint: mély bordó -> izzó rózsaszín -> fehér csillanás
  const stops = [
    [0.00, [70, 0, 20]],
    [0.30, [160, 6, 48]],
    [0.55, [255, 40, 100]],
    [0.80, [255, 150, 190]],
    [1.00, [255, 245, 250]],
  ];
  function colorAt(t) {
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
        const k = (t - t0) / (t1 - t0);
        return `rgb(${c0.map((c, j) => Math.round(c + (c1[j] - c) * k)).join(',')})`;
      }
    }
    return 'rgb(255,245,250)';
  }
  const COLORS = Array.from({ length: LEVELS }, (_, i) => colorAt(i / (LEVELS - 1)));
  const CHARS = Array.from({ length: LEVELS }, (_, i) =>
    RAMP[Math.min(RAMP.length - 1, 1 + Math.floor(i / (LEVELS - 1) * (RAMP.length - 1)))]);

  // A klasszikus 3D szív implicit felülete: f < 0 belül
  function heart(x, y, z) {
    const a = x * x + 2.25 * y * y + z * z - 1;
    const z3 = z * z * z;
    return a * a * a - x * x * z3 - 0.1125 * y * y * z3;
  }

  let W, H, dpr, fs, cw, ch, S, cols, rows;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    S = Math.min(W * 0.34, H * 0.32);
    fs = Math.max(7, Math.min(15, (2.4 * S / 74) / 0.6));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `800 ${fs}px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace`;
    cw = ctx.measureText('M').width;
    ch = fs * 1.12;
    cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
    initStars();
  }

  // Háttér: halványan pislákoló ASCII csillagok
  let stars = [];
  function initStars() {
    const n = Math.round(W * H / 5200);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      c: '.·+*'[Math.floor(Math.random() * 4)],
      p: Math.random() * Math.PI * 2, s: 0.4 + Math.random() * 1.4,
      v: 4 + Math.random() * 10,
    }));
  }

  // Kattintásra kirepülő ASCII részecskék
  let parts = [];
  let kick = 0;
  function burst(x, y) {
    kick = 1;
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 320;
      parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
        life: 1, c: '♥<3*+.'[Math.floor(Math.random() * 6)],
      });
    }
  }

  // Dupla szívdobbanás görbe
  function beat(t) {
    const b = t % 1.1;
    const g = (m, w) => Math.exp(-(((b - m) / w) ** 2));
    return g(0.08, 0.055) + 0.6 * g(0.3, 0.06);
  }

  const L = (() => { const v = [-0.55, 0.6, 0.6]; const n = Math.hypot(...v); return v.map(c => c / n); })();
  const Hv = (() => { const v = [L[0], L[1], L[2] + 1]; const n = Math.hypot(...v); return v.map(c => c / n); })();

  let started = false, t0 = 0, last = 0;
  const buckets = Array.from({ length: LEVELS }, () => []);

  function frame(now) {
    const t = (now - t0) / 1000;
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    ctx.clearRect(0, 0, W, H);

    // csillagok
    ctx.fillStyle = '#ff8fb4';
    for (const s of stars) {
      s.y -= s.v * dt; if (s.y < -10) { s.y = H + 10; s.x = Math.random() * W; }
      ctx.globalAlpha = 0.08 + 0.18 * (0.5 + 0.5 * Math.sin(t * s.s + s.p));
      ctx.fillText(s.c, s.x, s.y);
    }
    ctx.globalAlpha = 1;

    if (started) drawHeart(t, dt);
    requestAnimationFrame(frame);
  }

  function drawHeart(t, dt) {
    const intro = Math.min(1, t / 1.4);
    // rugalmas felnövés
    const grow = intro >= 1 ? 1 : 1 - Math.pow(2, -9 * intro) * Math.cos(intro * 9.5);
    kick = Math.max(0, kick - dt * 2.5);
    const pulse = beat(t);
    const sc = Math.max(0.001, grow * (1 + 0.075 * pulse + 0.18 * kick * kick));

    const spin = reduce ? t * 0.35 : t * 1.15;
    const tilt = 0.28 * Math.sin(t * 0.7);
    const cA = Math.cos(spin), sA = Math.sin(spin), cB = Math.cos(tilt), sB = Math.sin(tilt);
    const cx = W / 2, cy = H / 2 + S * 0.02;

    // nézet-térbeli pont -> szív koordináta
    const f = (u, v, w) => {
      const v2 = v * cB - w * sB, w2 = v * sB + w * cB;
      const x = (u * cA + w2 * sA) / sc;
      const y = (-u * sA + w2 * cA) / sc;
      const z = (v2 + 0.08) / sc;
      return heart(x, y, z);
    };

    for (const b of buckets) b.length = 0;
    const R = 1.45 * sc;
    const c0 = Math.max(0, Math.floor((cx - R * S) / cw)), c1 = Math.min(cols, Math.ceil((cx + R * S) / cw));
    const r0 = Math.max(0, Math.floor((cy - R * S) / ch)), r1 = Math.min(rows, Math.ceil((cy + R * S) / ch));
    const step = 0.07 * Math.max(0.5, sc);
    const eps = 0.003;
    const scramble = intro < 1 ? (1 - intro) ** 1.5 : 0;
    let lowest = -Infinity;

    for (let r = r0; r < r1; r++) {
      const v = -((r + 0.5) * ch - cy) / S;
      for (let c = c0; c < c1; c++) {
        const u = ((c + 0.5) * cw - cx) / S;
        if (u * u + v * v > R * R) continue;
        const wmax = Math.sqrt(R * R - u * u - v * v);
        let wPrev = wmax, fPrev = f(u, v, wPrev), hit = null;
        for (let w = wmax - step; w >= -wmax; w -= step) {
          const fv = f(u, v, w);
          if (fv < 0) {
            let a = w, bw = wPrev; // a: belül, bw: kívül
            for (let k = 0; k < 9; k++) {
              const m = (a + bw) / 2;
              if (f(u, v, m) < 0) a = m; else bw = m;
            }
            hit = (a + bw) / 2;
            break;
          }
          wPrev = w; fPrev = fv;
        }
        if (hit === null) continue;

        // normálvektor gradiensből
        let nx = f(u + eps, v, hit) - f(u - eps, v, hit);
        let ny = f(u, v + eps, hit) - f(u, v - eps, hit);
        let nz = f(u, v, hit + eps) - f(u, v, hit - eps);
        const nl = Math.hypot(nx, ny, nz) || 1;
        nx /= nl; ny /= nl; nz /= nl;
        if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }

        const diff = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
        const spec = Math.pow(Math.max(0, nx * Hv[0] + ny * Hv[1] + nz * Hv[2]), 28);
        const rim = Math.pow(1 - nz, 2.5);
        let lum = 0.03 + 0.62 * diff + 0.7 * spec + 0.3 * rim + 0.1 * pulse;
        lum = Math.max(0, Math.min(1, lum));
        const lvl = Math.round(lum * (LEVELS - 1));
        buckets[lvl].push(c, r);
        if (r > lowest) lowest = r;
      }
    }

    // halvány tükröződés a szív alatt
    const mirror = lowest + 1.5;
    ctx.globalAlpha = 0.11;
    for (let l = 0; l < LEVELS; l++) {
      const b = buckets[l]; if (!b.length) continue;
      ctx.fillStyle = COLORS[l]; const chr = CHARS[l];
      for (let i = 0; i < b.length; i += 2) {
        const rr = 2 * mirror - b[i + 1];
        if (rr - mirror > 14 || rr >= rows) continue;
        ctx.fillText(chr, b[i] * cw, rr * ch + ch * 0.8);
      }
    }
    ctx.globalAlpha = 1;

    // maga a szív
    for (let l = 0; l < LEVELS; l++) {
      const b = buckets[l]; if (!b.length) continue;
      ctx.fillStyle = COLORS[l]; const chr = CHARS[l];
      for (let i = 0; i < b.length; i += 2) {
        const glyph = scramble && Math.random() < scramble
          ? SCRAMBLE[(Math.random() * SCRAMBLE.length) | 0] : chr;
        ctx.fillText(glyph, b[i] * cw, b[i + 1] * ch + ch * 0.8);
      }
    }

    // részecskék
    for (const p of parts) {
      p.life -= dt * 0.8; p.vy += 260 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.life > 0.6 ? '#fff0f5' : '#ff2d6f';
      ctx.fillText(p.c, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    parts = parts.filter(p => p.life > 0);
  }

  document.getElementById('go').addEventListener('click', () => {
    stage.classList.add('gone');
    hint.classList.add('on');
    started = true;
    t0 = performance.now();
  });
  cv.addEventListener('pointerdown', e => { if (started) burst(e.clientX, e.clientY); });

  addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  t0 = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
